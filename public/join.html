<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIO - Join Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="lobby join-lobby">

        <h1>TRIO</h1>

        <p class="join-subtitle">
            Enter the Rainforest
        </p>

        <section class="join-panel">

            <h2>Join the Adventure</h2>

            <p class="join-description">
                Enter your name to join your friends!
            </p>

            <label for="player-name">Player Name</label>

            <input
                type="text"
                id="player-name"
                placeholder="Enter your name"
                maxlength="20"
                autocomplete="off"
            >

            <button id="join-game-button">
                Join Game
            </button>

            <p id="join-message" aria-live="polite"></p>

        </section>

    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on("connect", () => {
            console.log("Connected to TRIO server:", socket.id);
        });

        socket.on("disconnect", (reason) => {
            console.log("Disconnected from TRIO server:", reason);
        });
    </script>
    <script src="join.js"></script>
</body>
</html>
