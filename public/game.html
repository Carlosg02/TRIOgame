<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIO Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative rainforest background -->
    <div class="jungle-background" aria-hidden="true">
        <div class="jungle-glow"></div>

        <div class="jungle-foliage jungle-foliage-left"></div>
        <div class="jungle-foliage jungle-foliage-right"></div>
        <div class="jungle-flowers"></div>
    </div>
    <main class="player-screen">
        <h1>TRIO</h1>
        <section id="turn-announcement-message"></section>
        <section id="turn-message"></section>
        <div class="game-layout">
            <div class="game-table">
                <section id="players"></section>

                <section class="center-area">
                    <h2>Center Cards</h2>
                    <section id="center-cards"></section>
                </section>
            </div>

            <section class="hand-area">
                <h2>Your Hand</h2>
                <section id="player-hand"></section>
            </section>
        </div>
        
        
    </main>
    <!-- Trio collection celebration -->
    <div id="trio-celebration" class="trio-celebration hidden">
        <div class="trio-celebration-content">
            <h2>TRIO!</h2>
            <img id="trio-celebration-animal" src="" alt="Collected Trio animal">
            <p id="trio-celebration-player"></p>
        </div>
    </div>
    <!-- Victory celebration overlay -->
    <div id="victory-celebration" class="victory-celebration hidden">

        <div id="victory-confetti"></div>

        <div class="victory-celebration-content">
            <h2>WINNER!</h2>
            <h3 id="victory-player-name"></h3>

            <p>Collected Trios</p>
            <div id="victory-trios"></div>

            <button id="new-game-button" hidden>New Game</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
