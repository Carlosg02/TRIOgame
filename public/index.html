<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIO Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="lobby">
        <h1>TRIO</h1>
        <p>Welcome to the game lobby!</p>

        <section class="player-selection">
            <h2>Number of Players</h2>

            <button class="lobby-button">3 Players</button>
            <button class="lobby-button">4 Players</button>
            <button class="lobby-button">5 Players</button>
            <button class="lobby-button">6 Players</button>

            <p id="selection-message"></p>

            <button id="start-game-button">Start Game</button>
            <p id="start-message"></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
