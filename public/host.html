<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIO - Host</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="lobby host-lobby">
        <h1>TRIO Host Lobby</h1>

        <section class="host-player">
            <h2>Your Name</h2>
            <input id="host-name" type="text" placeholder="Enter your name">
        </section>

        <section class="player-selection">
            <h2>Number of Players</h2>

            <button class="lobby-button">3 Players</button>
            <button class="lobby-button">4 Players</button>
            <button class="lobby-button">5 Players</button>
            <button class="lobby-button">6 Players</button>

            <p id="selection-message"></p>

        </section>

        <section class="connected-players">
            <h2>Connected Players</h2>

            <ul id="player-list"></ul>
        </section>

        <button id="start-game-button">Start Game</button>
        <p id="start-message"></p>

        
    </main>
    <script src="host.js"></script>
</body>
